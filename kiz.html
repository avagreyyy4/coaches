<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kiz — Coach Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div id="config-warning" class="banner banner-warn" hidden>
    Supabase is not configured yet. Edit <code>js/config.js</code> with your project URL and anon key.
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">Coach Checklist</div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-link">Home</a>
        <button type="button" id="coaches-toggle" class="nav-group-toggle" aria-expanded="true" aria-controls="coaches-subnav">
          Coaches
          <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="nav-subnav" id="coaches-subnav">
        <a href="ty.html" class="nav-link">TC</a>
        <a href="allie.html" class="nav-link">ABC</a>
        <a href="kiz.html" class="nav-link active">KG</a>
        </div>
      </nav>
      <div class="sidebar-spacer"></div>
      <div id="session-info" class="session-info" hidden>
        <span id="user-email"></span>
        <button id="logout-btn" class="btn btn-ghost">Log out</button>
      </div>
    </aside>

    <main class="content">
      <section id="auth-panel" class="panel">
      <h2>Coach Login</h2>

      <form id="password-form">
        <label>
          Email
          <input type="email" id="password-email" required autocomplete="email" />
        </label>
        <label>
          Password
          <input type="password" id="password-password" required autocomplete="current-password" />
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Log In</button>
          <button type="button" id="signup-btn" class="btn btn-secondary">Sign Up</button>
        </div>
        <p id="password-message" class="form-message"></p>
      </form>
    </section>

    <section id="app-panel" hidden>
      <div id="coach-dashboard">
        <div class="coach-header">
          <h1 id="coach-name"></h1>
        </div>

        <div class="coach-layout">
          <div class="calendar-panel">
            <div class="calendar-toolbar">
              <p id="calendar-period-label" class="calendar-period-label"></p>
              <div class="calendar-controls">
                <div class="view-switch" id="view-switch">
                  <button type="button" class="view-btn" data-view="3day">3 day</button>
                  <button type="button" class="view-btn" data-view="5day">5 day</button>
                  <button type="button" class="view-btn" data-view="month">Month</button>
                </div>
                <button type="button" id="cal-prev" class="cal-nav-btn" aria-label="Previous period"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                <button type="button" id="cal-today" class="cal-today-btn">Today</button>
                <button type="button" id="cal-next" class="cal-nav-btn" aria-label="Next period"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
              </div>
            </div>
            <div id="calendar-body"></div>
          </div>

          <div class="recruits-panel">
            <h2>Today</h2>
            <p id="recruits-summary" class="recruits-summary"></p>
            <div id="recruits-list"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/data.js"></script>
  <script>window.COACH_ID = "kiz";</script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/coach-dashboard.js"></script>
</body>
</html>

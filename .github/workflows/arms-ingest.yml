name: ARMS Daily Export (Supabase)

on:
  schedule:
    # Every 6 hours, so a recruit ARMS marks Dropped / NFU / GradesLow
    # disappears from the coach lists within hours (the site reads that
    # straight off the synced `arms` table). Cron is UTC-only, so this is
    # deliberately DST-agnostic; :30 keeps it clear of the 1am ET
    # nightly-queue job.
    - cron: "30 */6 * * *"
  workflow_dispatch: # lets you trigger a run manually any time (e.g. today)

concurrency:
  group: arms-daily-supabase
  cancel-in-progress: false

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install pandas supabase python-dotenv playwright pyarrow psycopg2-binary
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Run fetch (headless)
        working-directory: scripts
        env:
          HEADLESS: "true"
          ARMS_USERNAME: ${{ secrets.ARMS_USERNAME }}
          ARMS_PASSWORD: ${{ secrets.ARMS_PASSWORD }}
          ARMS_BASE_URL: ${{ secrets.ARMS_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_and_push.py

      - name: Sync ACS rank from ARMS onto the roster
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_roster_from_arms.py

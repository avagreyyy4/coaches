name: ARMS Daily Export (Supabase)

on:
  schedule:
    # GitHub Actions cron is UTC-only, and 3am Eastern shifts with DST —
    # split across two schedules so it lands on 3am ET either way. Offset
    # from the 1am ET nightly-queue job so the two never overlap. The
    # ~1-week window around the actual DST changeover (early Nov / mid Mar)
    # will be off by an hour; not worth cron-level precision for this.
    - cron: "0 7 * 3-10 *"      # 3am EDT (UTC-4), Mar–Oct
    - cron: "0 8 * 11,12,1,2 *" # 3am EST (UTC-5), Nov–Feb
  workflow_dispatch: # lets you trigger a run manually any time (e.g. today)

concurrency:
  group: arms-daily-supabase
  cancel-in-progress: false

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install pandas supabase python-dotenv playwright pyarrow psycopg2-binary
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Run fetch (headless)
        working-directory: scripts
        env:
          HEADLESS: "true"
          ARMS_USERNAME: ${{ secrets.ARMS_USERNAME }}
          ARMS_PASSWORD: ${{ secrets.ARMS_PASSWORD }}
          ARMS_BASE_URL: ${{ secrets.ARMS_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_and_push.py

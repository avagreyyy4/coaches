name: Calendar Sync — Staff + WBB (Supabase)

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      diagnose:
        description: "List calendars the service account can see, instead of syncing"
        type: boolean
        default: false

concurrency:
  group: staff-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv google-api-python-client google-auth psycopg2-binary requests icalendar recurring-ical-events

      - name: Sync calendars
        working-directory: scripts
        env:
          GOOGLE_CALENDAR_SA_JSON: ${{ secrets.GOOGLE_CALENDAR_SA_JSON }}
          STAFF_CALENDAR_ID: ${{ secrets.STAFF_CALENDAR_ID }}
          WBB_CALENDAR_ID: ${{ secrets.WBB_CALENDAR_ID }}
          STAFF_CALENDAR_ICAL_URL: ${{ secrets.STAFF_CALENDAR_ICAL_URL }}
          WBB_CALENDAR_ICAL_URL: ${{ secrets.WBB_CALENDAR_ICAL_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_calendar.py ${{ inputs.diagnose && '--diagnose' || '' }}

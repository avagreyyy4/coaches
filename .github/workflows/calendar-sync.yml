name: Staff Calendar Sync (Supabase)

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

concurrency:
  group: staff-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv google-api-python-client google-auth

      - name: Sync staff calendar
        working-directory: scripts
        env:
          GOOGLE_CALENDAR_SA_JSON: ${{ secrets.GOOGLE_CALENDAR_SA_JSON }}
          STAFF_CALENDAR_ID: ${{ secrets.STAFF_CALENDAR_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fetch_calendar.py
